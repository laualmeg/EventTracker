<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eventos</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,sans-serif}
    body{min-height:100vh;background:#f3f4f6;color:#1f2937;display:flex;align-items:center;justify-content:center;padding:24px}
    .container{width:100%;max-width:700px;background:white;border-radius:20px;padding:40px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
    h1{font-size:34px;margin-bottom:8px;text-align:center}
    .subtitle{text-align:center;color:#6b7280;margin-bottom:32px}
    .events{display:grid;gap:14px}
    .event{display:block;text-decoration:none;color:#1f2937;background:#f9fafb;border:1px solid #e5e7eb;border-radius:14px;padding:18px 20px;transition:.15s ease}
    .event:hover{background:#eff6ff;border-color:#93c5fd;transform:translateY(-1px)}
    .event-title{font-size:19px;font-weight:700;margin-bottom:4px}
    .event-description{color:#6b7280;font-size:14px}
    @media(max-width:600px){.container{padding:28px 20px}h1{font-size:28px}}
  </style>
</head>
<body>
  <main class="container">
    <h1>🎉 Eventos</h1>
    <p class="subtitle">Selecciona el evento al que quieres acceder</p>
    <div class="events">
      <a class="event" href="/san-juan.html">
        <div class="event-title">🔥 San Juan 2026</div>
        <div class="event-description">Gestión de asistentes y buffet compartido</div>
      </a>
      <a class="event" href="/proclamacion.html">
        <div class="event-title">👑 Proclamación</div>
        <div class="event-description">Acceder al evento</div>
      </a>
      <a class="event" href="/halloween.html">
        <div class="event-title">🎃 Halloween</div>
        <div class="event-description">Acceder al evento</div>
      </a>
      <a class="event" href="/comida-navidad.html">
        <div class="event-title">🎄 Comida de Navidad</div>
        <div class="event-description">Acceder al evento</div>
      </a>
    </div>
  </main>
</body>
</html>
